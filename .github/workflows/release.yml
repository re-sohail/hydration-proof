name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  release:
    # npm trusted publishing (OIDC) requires a GitHub-hosted runner.
    runs-on: ubuntu-latest
    permissions:
      contents: write # changesets pushes the version PR and tags
      pull-requests: write
      id-token: write # OIDC for npm trusted publishing
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      # Trusted publishing needs npm >= 11.5.1.
      - run: npm i -g npm@latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm --filter hydration-proof exec playwright-core install --with-deps chromium firefox webkit
      - run: pnpm test
      - run: pnpm fixtures:build
      - run: pnpm test:e2e
      - run: pnpm build

      - uses: changesets/action@v1
        with:
          publish: pnpm changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No NPM_TOKEN: authentication uses npm trusted publishing (OIDC),
          # configured on npmjs.com for this workflow.
