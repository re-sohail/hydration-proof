name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Generated docs and schemas are current
        run: pnpm docs:check

      - name: Install browsers
        run: pnpm --filter hydration-proof exec playwright-core install --with-deps chromium firefox webkit

      - name: Unit and browser tests (React 18/19, dev/prod, 3 browsers)
        run: pnpm test

      - name: Build fixture apps
        run: pnpm fixtures:build

      - name: Fixture detection (production builds)
        run: pnpm test:e2e

      - name: React confirms every broken fixture (development)
        run: pnpm verify:fixtures

      # Also runs publint, are-the-types-wrong and the size budget.
      - name: Build package
        run: pnpm build

      - name: Built package tests
        run: pnpm test:unit

      - name: What would be published
        run: cd packages/hydration-proof && npm pack --dry-run

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fixture-results
          path: packages/hydration-proof/test-results

  node-versions:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22.18.0, 24, 26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter hydration-proof exec playwright-core install --with-deps chromium
      - run: pnpm --filter hydration-proof test:unit
      - run: pnpm --filter hydration-proof exec vitest run --project browser tests/browser/runtime.test.ts
